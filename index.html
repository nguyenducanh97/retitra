<style>
  :root { --text: #e8eeff; --muted: #8b97b8; --line: rgb(120 160 255 / 16%); --cyan: #22d3ee; --violet: #8b5cf6; color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px;
    background: radial-gradient(1000px 600px at 50% 10%, #121a33, #05070d 70%); color: var(--text);

  }
  body::before, body::after { content: ""; position: fixed; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(90px); opacity: .3; pointer-events: none; }
  body::before { background: radial-gradient(circle, var(--cyan), transparent 65%); top: -25vmax; left: -15vmax; animation: d1 24s ease-in-out infinite alternate; }
  body::after { background: radial-gradient(circle, var(--violet), transparent 65%); bottom: -25vmax; right: -15vmax; animation: d2 30s ease-in-out infinite alternate; }
  @keyframes d1 { to { transform: translate(16vmax, 10vmax) scale(1.15); } }
  @keyframes d2 { to { transform: translate(-14vmax, -12vmax) scale(1.2); } }
  .box {
    position: relative; z-index: 1; width: min(380px, 100%); padding: 32px 26px 26px; border-radius: 20px; text-align: center;
    background: rgb(12 18 34 / 72%); border: 1px solid var(--line); backdrop-filter: blur(18px);
    box-shadow: 0 30px 80px rgb(0 0 0 / 55%), 0 0 0 1px rgb(34 211 238 / 12%); animation: up .6s ease-out both;
  }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } }
  .name {
    font: 700 42px/1 "Space Grotesk", "Inter", sans-serif; letter-spacing: -0.03em;
    background: linear-gradient(90deg, #e8eeff 0%, #e8eeff 30%, var(--cyan) 50%, #a78bfa 70%, #e8eeff 90%);
    background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 7s ease-in-out infinite;
  }
  .name em { font-style: normal; background: linear-gradient(135deg, var(--cyan), var(--violet)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .name i { display: inline-block; width: 4px; height: .78em; margin-left: 4px; border-radius: 2px; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); animation: caret 1.05s steps(1) infinite; }
  @keyframes shine { 0%, 100% { background-position: 100% 0; } 50% { background-position: 0% 0; } }
  @keyframes caret { 50% { opacity: 0; } }
  .tag { margin: 10px 0 24px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .tag b { color: #7dd3fc; }
  label { display: block; text-align: left; font-size: 13px; color: var(--muted); margin: 0 0 5px; font-weight: 500; }
  input {
    width: 100%; padding: 10px 12px; margin-bottom: 14px; border: 1px solid var(--line); border-radius: 10px;
    background: rgb(3 6 14 / 60%); color: var(--text); font: inherit;
  }
  input:focus { outline: none; border-color: rgb(34 211 238 / 60%); box-shadow: 0 0 0 3px rgb(34 211 238 / 15%); }
  button {
    width: 100%; padding: 11px; border: none; border-radius: 11px; font: inherit; font-weight: 700; cursor: pointer; color: #04121a;
    background: linear-gradient(135deg, #22d3ee, #3b82f6 55%, #8b5cf6); box-shadow: 0 0 22px rgb(34 211 238 / 35%);
  }
  button:disabled { opacity: .55; cursor: wait; }
  .err { min-height: 20px; margin-top: 12px; font-size: 13px; color: #ff8fa3; }
  .ft { position: relative; z-index: 1; margin-top: 18px; font-size: 12px; color: var(--muted); text-align: center; }
  .ft a { color: #7dd3fc; text-decoration: none; }
  .about { margin: -12px 0 20px; font-size: 13px; color: var(--muted); }
  h1 { margin: 0; font-size: inherit; font-weight: inherit; }
  :root[data-theme="light"] { --text: #0f172a; --muted: #5a6784; --line: rgb(40 70 150 / 16%); --cyan: #0891b2; --violet: #7c3aed; color-scheme: light; }

  :root[data-theme="light"] body::before, :root[data-theme="light"] body::after { opacity: .14; }
  :root[data-theme="light"] .box { background: rgb(255 255 255 / 85%); box-shadow: 0 24px 60px rgb(15 23 42 / 12%); }
  :root[data-theme="light"] .name { background-image: linear-gradient(90deg, #0f172a 0%, #0f172a 30%, #0891b2 50%, #7c3aed 70%, #0f172a 90%); }
  :root[data-theme="light"] .tag b, :root[data-theme="light"] .ft a { color: #0891b2; }
  :root[data-theme="light"] input { background: #fff; }
  :root[data-theme="light"] button { color: #fff; background: linear-gradient(135deg, #0891b2, #2563eb 55%, #7c3aed); box-shadow: 0 4px 16px rgb(37 99 235 / 28%); }
  :root[data-theme="light"] .err { color: #be123c; }
  @media (prefers-reduced-motion: reduce) { body::before, body::after, .name, .name i, .box { animation: none; } }

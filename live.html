<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#05070f" />
<title>RetiTra · Live captions</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #05070f; --panel: rgb(14 20 38 / 85%); --border: rgb(120 160 255 / 18%);
    --text: #e8eeff; --muted: #8fa1cf; --trans: #ffffff; --accent: #22d3ee; --ok: #34f5c5; --warn: #fbbf24;
    --size: 22px;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f6fc; --panel: rgb(255 255 255 / 92%); --border: rgb(40 70 150 / 15%);
      --text: #0f172a; --muted: #5a6784; --trans: #0b1220; --accent: #0891b2; --ok: #059669; --warn: #b45309;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(900px 600px at 80% -10%, rgb(34 211 238 / 10%), transparent 60%), var(--bg);
    color: var(--text); font: 16px/1.5 "Inter", "Noto Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: var(--panel); border-bottom: 1px solid var(--border);
    backdrop-filter: blur(12px);
  }
  .brand { font-weight: 600; letter-spacing: -0.01em; }
  .brand em { font-style: normal; color: var(--accent); }
  .title { flex: 1; min-width: 0; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .build { font-size: 10px; color: var(--muted); opacity: .55; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status.live i { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .status.bad i { background: var(--warn); }
  main { flex: 1; overflow-y: auto; padding: 14px 16px 40vh; -webkit-overflow-scrolling: touch; }
  .line { padding: 10px 0 12px; border-bottom: 1px solid var(--border); }
  .line .who { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
  .line .o { color: var(--muted); font-size: calc(var(--size) * 0.7); line-height: 1.4; }
  .line .t { color: var(--trans); font-size: var(--size); font-weight: 500; line-height: 1.38; margin-top: 2px; }
  .line .t.wait { color: var(--muted); font-style: italic; font-size: calc(var(--size) * 0.6); font-weight: 400; }
  .line.old { opacity: 0.6; }
  body.no-orig .line .o { display: none; }
  .line.blank { display: none; }
  .empty { color: var(--muted); text-align: center; margin: 18vh 12px; font-size: 15px; }
  footer {
    position: sticky; bottom: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid var(--border);
    backdrop-filter: blur(12px);
  }
  button {
    font: inherit; font-size: 14px; color: var(--text); background: transparent; border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 12px; cursor: pointer; min-height: 42px;
  }
  button.on { border-color: var(--ok); color: var(--ok); }
  #speak { flex: 1; min-width: 150px; font-weight: 600; }
  #voice { font: inherit; font-size: 14px; color: var(--text); background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 8px; min-height: 42px; max-width: 100%; flex: 1 1 100%; order: 5; }
  .jump {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom)); z-index: 3;
    background: var(--accent); color: #001018; border: none; font-weight: 600; box-shadow: 0 6px 20px rgb(0 0 0 / 35%);
  }
  /* Battery saver: pure black (OLED screens use almost no power for black), newest line in dim text. */
  #blackout { position: fixed; inset: 0; z-index: 20; background: #000; display: flex; flex-direction: column;
    justify-content: center; align-items: center; gap: 18px; padding: 24px; cursor: pointer; }
  #blackout[hidden] { display: none; }
  #boLine { color: #6b6b6b; font-size: calc(var(--size) * 0.95); line-height: 1.4; text-align: center; max-width: 34em; }
  #boHint { color: #333; font-size: 12px; position: absolute; bottom: calc(18px + env(safe-area-inset-bottom)); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
  <header>
    <span class="brand">Re<em>ti</em>Tra</span>
    <span class="title" id="title">Live captions</span>
    <span class="status" id="status"><i></i><span id="statusText">Connecting…</span></span>
    <span class="build" title="Version of this page">1117-13</span>
  </header>
  <main id="main" aria-label="Live captions">
    <p class="empty" id="empty">Waiting for the presenter…</p>
    <div id="lines"></div>
  </main>
  <button class="jump" id="jump" hidden>Jump to latest</button>
  <footer>
    <button id="speak" aria-pressed="false">Read aloud: off</button>
    <select id="voice" aria-label="Voice" hidden></select>
    <button id="smaller" aria-label="Smaller text">A−</button>
    <button id="bigger" aria-label="Larger text">A+</button>
    <button id="black" aria-label="Black screen to save battery">Black screen</button>
  </footer>
  <div class="sr" aria-live="polite" id="announce"></div>
  <div id="blackout" hidden>
    <div id="boLine"></div>
    <div id="boHint">Black screen saves battery. Tap to return.</div>
  </div>

<script>
(() => {
  const DB = "https://retitra-live-default-rtdb.asia-southeast1.firebasedatabase.app";
  const room = (location.hash.slice(1) || new URLSearchParams(location.search).get("room") || "").replace(/[^a-z0-9]/gi, "");
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem("rtv." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("rtv." + k, JSON.stringify(v)); } catch { /* private mode */ } },
  };
  let state = {}; // { owner, meta: {...}, lines: { sid: { o, t, s, c, w, f } } }
  const els = new Map(); // sid -> { el, json }

  // ---- text size and original toggle (this phone only) ----
  let size = store.get("size", 22);
  const setSize = (px) => { size = Math.max(14, Math.min(44, px)); document.documentElement.style.setProperty("--size", size + "px"); store.set("size", size); };
  setSize(size);
  $("smaller").onclick = () => setSize(size - 2);
  $("bigger").onclick = () => setSize(size + 2);
  // Phones show the translation only (the original is not shown).
  const applyOrig = () => document.body.classList.add("no-orig");

  // ---- status ----
  function status(kind, text) {
    $("status").className = "status " + kind;
    $("statusText").textContent = text;
  }

  // ---- rendering: only changed lines are touched; the view follows the newest line unless scrolled up ----
  const main = $("main");
  let follow = true;
  main.addEventListener("scroll", () => {
    follow = main.scrollHeight - main.scrollTop - main.clientHeight < 140;
    $("jump").hidden = follow;
  }, { passive: true });
  $("jump").onclick = () => { follow = true; main.scrollTop = main.scrollHeight; $("jump").hidden = true; };
  function render() {
    const lines = cleanLines();
    const ids = Object.keys(lines).map(Number).sort((a, b) => a - b);
    $("empty").hidden = ids.length > 0;
    if (!state.owner && !ids.length) $("empty").textContent = room ? "This meeting hasn't started yet, or it has ended." : "Scan the QR code on the screen to follow the meeting.";
    else $("empty").textContent = "Waiting for the presenter…";
    for (const [sid, rec] of els) if (!(sid in lines)) { rec.el.remove(); els.delete(sid); }
    const box = $("lines");
    let prev = null;
    const lastT = ids.slice().reverse().find((id) => lines[id].t);
    for (const id of ids) {
      const l = lines[id], json = JSON.stringify(l);
      let rec = els.get(String(id));
      if (!rec) {
        const el = document.createElement("div");
        el.className = "line";
        el.innerHTML = '<div class="who" hidden></div><div class="o"></div><div class="t"></div>';
        rec = { el, json: "" };
        els.set(String(id), rec);
        if (prev) prev.after(el); else box.prepend(el);
      }
      if (rec.json !== json) {
        if (!rec.json || JSON.parse(rec.json).t !== l.t) changedAt[id] = Date.now();
        rec.json = json;
        const who = rec.el.children[0], o = rec.el.children[1], t = rec.el.children[2];
        who.hidden = !l.s; who.textContent = l.s || ""; who.style.color = l.c || "";
        o.textContent = l.o || ""; o.hidden = !l.o;
        t.textContent = l.w ? "translating…" : (l.t || "");
        t.className = "t" + (l.w ? " wait" : "");
        rec.el.classList.toggle("blank", !l.w && !(l.t || "").trim()); // nothing to show yet
      }
      rec.el.classList.toggle("old", lastT != null && id < lastT - 1);
      prev = rec.el;
    }
    // Keep the page light: only the last 300 lines stay on the page.
    while (els.size > 300) { const [k, rec] = els.entries().next().value; rec.el.remove(); els.delete(k); }
    const m = state.meta || {};
    $("title").textContent = m.title || (m.targetName ? "Live captions · " + m.targetName : "Live captions");
    if (m.title) document.title = m.title + " · RetiTra";
    applyOrig();
    fillVoices();
    updateBlackout();
    if (follow) main.scrollTop = main.scrollHeight;
    speakTick();
  }

  // ---- read aloud with this phone's own voice, as soon as words arrive (not waiting for the sentence) ----
  // A reading position (line, character) follows the text: whenever the voice is free, everything new up to
  // the last complete word is spoken at once. A line still growing is read word by word as it grows; when the
  // voice falls behind it speeds up, and far behind it skips to the newest line.
  let speakOn = false, cur = null; // cur = { id, pos }
  const changedAt = {};            // line id -> when its text last changed
  const BCP = { en: "en-US", vi: "vi-VN", ko: "ko-KR", ja: "ja-JP", zh: "zh-CN", "zh-TW": "zh-TW", fr: "fr-FR", de: "de-DE", es: "es-ES",
    pt: "pt-BR", ru: "ru-RU", th: "th-TH", id: "id-ID", ms: "ms-MY", hi: "hi-IN", ar: "ar-SA", it: "it-IT", nl: "nl-NL", tr: "tr-TR" };
  const NO_SPACES = /^(ja|zh|th|zh-TW)$/;
  const synth = window.speechSynthesis;
  // Voices for the meeting's language, the most natural first: online/neural voices ("Microsoft HoaiMy Online
  // (Natural)" in Edge, Google's online voices on Android/Chrome, "Enhanced"/"Premium" voices on iPhone) sound
  // far more human than the basic offline ones.
  function voicesFor(lang) {
    const all = synth?.getVoices?.() || [];
    const want = lang.toLowerCase(), base = want.split("-")[0];
    const norm = (v) => v.lang.toLowerCase().replace("_", "-");
    const score = (v) => (/natural|neural|online|enhanced|premium|wavenet|studio/i.test(v.name) ? 20 : 0) +
      (v.localService === false ? 8 : 0) + (/google/i.test(v.name) ? 3 : 0) + (norm(v) === want ? 2 : 0) -
      (/compact|espeak/i.test(v.name) ? 10 : 0);
    return all.filter((v) => norm(v) === want || norm(v).split("-")[0] === base).sort((a, b) => score(b) - score(a));
  }
  function voiceFor(lang) {
    const list = voicesFor(lang);
    const chosen = store.get("voice." + lang, "ai");
    return list.find((v) => v.name === chosen) || list[0] || null;
  }
  const useAi = () => store.get("voice." + (BCP[state.meta?.target] || state.meta?.target || ""), "ai") === "ai";
  function fillVoices() {
    const sel = $("voice"), lang = BCP[state.meta?.target] || state.meta?.target || "";
    const list = lang ? voicesFor(lang) : [];
    const key = lang + "|" + list.map((v) => v.name).join("|");
    if (sel.dataset.key === key) return;
    sel.dataset.key = key;
    sel.replaceChildren(new Option("AI interpreter voice (natural)", "ai"),
      ...list.map((v) => new Option("Phone voice: " + v.name.replace(/\s*-\s*.*$/, "").replace(/^Microsoft\s+/, ""), v.name)));
    if (!list.length) sel.append(new Option("Phone voice (default)", ""));
    const chosen = store.get("voice." + lang, "ai");
    sel.value = [...sel.options].some((o) => o.value === chosen) ? chosen : "ai";
    sel.hidden = false;
  }
  // Lines keyed "l<number>" (spoken order); empty entries skipped.
  function cleanLines() {
    const out = {};
    for (const [k, v] of Object.entries(state.lines || {})) {
      const n = Number(String(k).replace(/^l/, ""));
      if (v && typeof v === "object" && Number.isFinite(n)) out[n] = v;
    }
    return out;
  }
  const textOf = (l) => (l && !l.w ? l.t || "" : "");
  function speakTick() {
    const lines = cleanLines();
    const ids = Object.keys(lines).map(Number).sort((a, b) => a - b);
    // Screen readers: each finished translation announced once.
    for (const id of ids) if (lines[id].f && textOf(lines[id]) && id > (speakTick.announced ?? -1)) { $("announce").textContent = lines[id].t; speakTick.announced = id; }
    if (!speakOn || useAi() || !synth || !ids.length || synth.speaking || synth.pending) return;
    if (!cur || !(cur.id in lines)) cur = { id: ids.find((id) => !cur || id >= cur.id) ?? ids[ids.length - 1], pos: 0 };
    const lastId = ids[ids.length - 1], now = Date.now();
    const noSpaces = NO_SPACES.test(state.meta?.target || "");
    let say = "", backlog = 0;
    for (let i = ids.indexOf(cur.id); i >= 0 && i < ids.length; i++) {
      const id = ids[i], t = textOf(lines[id]);
      if (id !== cur.id) cur = { id, pos: 0 };
      if (cur.pos > t.length) cur.pos = t.length; // (text rewritten shorter)
      const rest = t.slice(cur.pos);
      const complete = lines[id].f || id < lastId || now - (changedAt[id] || 0) > 900;
      let take = rest;
      if (!complete && !noSpaces) { const k = rest.search(/\s\S*$/); take = k >= 0 ? rest.slice(0, k + 1) : ""; } // whole words only
      if (take.trim()) say += (say ? " " : "") + take.trim();
      cur.pos += take.length;
      if (take.length < rest.length || lines[id].w) { backlog += rest.length - take.length; break; }
      if (id === lastId) break;
    }
    // Far behind (a long backlog of unread text): jump to the newest line.
    for (const id of ids) if (id > cur.id) backlog += textOf(lines[id]).length;
    if (say.length > 450) { const lastLine = textOf(lines[cur.id]); say = lastLine.slice(0, cur.pos); }
    if (!say.trim()) return;
    const lang = BCP[state.meta?.target] || state.meta?.target || "";
    const u = new SpeechSynthesisUtterance(say);
    if (lang) { u.lang = lang; const v = voiceFor(lang); if (v) u.voice = v; }
    u.rate = Math.min(1.6, 1 + Math.max(0, say.length - 60) / 300 + backlog / 400); // faster when text is waiting
    u.onend = u.onerror = () => setTimeout(speakTick, 30);
    synth.speak(u);
  }
  setInterval(speakTick, 250); // (a line that stops growing is finished off after 0.9 s)
  $("speak").onclick = () => {
    speakOn = !speakOn;
    $("speak").classList.toggle("on", speakOn);
    $("speak").setAttribute("aria-pressed", String(speakOn));
    $("speak").textContent = speakOn ? "Read aloud: on" : "Read aloud: off";
    synth?.cancel();
    if (!speakOn) aiStop();
    if (speakOn && useAi()) { aiStart(); keepAwake(); return; }
    if (speakOn) {
      // Start with the line being spoken now (not the whole backlog). A first utterance inside the tap
      // unlocks speech on iPhone.
      const ids = Object.keys(cleanLines()).map(Number).sort((a, b) => a - b);
      cur = ids.length ? { id: ids[ids.length - 1], pos: 0 } : null;
      const u = new SpeechSynthesisUtterance(" ");
      u.volume = 0; synth.speak(u);
      setTimeout(speakTick, 60);
      keepAwake();
    }
  };
  $("black").onclick = () => { $("blackout").hidden = false; updateBlackout(); keepAwake(); };
  $("blackout").onclick = () => { $("blackout").hidden = true; };
  function updateBlackout() {
    if ($("blackout").hidden) return;
    const lines = cleanLines();
    const id = Object.keys(lines).map(Number).sort((a, b) => b - a).find((k) => textOf(lines[k]));
    $("boLine").textContent = id != null ? lines[id].t : "Waiting for the presenter…";
  }
  synth?.addEventListener?.("voiceschanged", () => fillVoices());
  $("voice").onchange = (e) => {
    const lang = BCP[state.meta?.target] || state.meta?.target || "";
    store.set("voice." + lang, e.target.value);
    synth?.cancel();
    if (!speakOn) return;
    if (useAi()) aiStart();
    else {
      aiStop();
      const ids = Object.keys(cleanLines()).map(Number).sort((a, b) => a - b);
      cur = ids.length ? { id: ids[ids.length - 1], pos: 0 } : null;
      speakTick();
    }
  };

  // ---- AI interpreter voice: the translation model's own speech, streamed from the presenter's laptop ----
  // Pieces of 24 kHz mu-law audio arrive about every 0.2 s (in Fast at real-time speed; in Balanced/Accurate a
  // whole phrase at once). Like "Speak translation" on the website, each piece is scheduled with Web Audio to
  // start exactly where the previous one ends: no gaps, natural speed and pitch. A buffer (0.5 s, growing to
  // 2 s if the network turns out to be late) absorbs jitter; if the voice is more than 12 s behind, the waiting speech is skipped.
  let actx = null, aes = null, aLast = "", aNext = 0, aQueued = [], aSilent = null, aBuf = 0.5, aLastAt = 0, aRsPos = 0, aRsLast = 0;
  let aOut = null, aMedia = null; // where the voice goes: the phone's media player when possible
  const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
  // Catching up without touching the voice: pauses (10 ms frames below a quiet level) longer than 0.1 s are cut
  // down to 0.1 s; the speech itself is played exactly as Gemini made it. (A time-stretch kept the pitch on paper
  // but made the voice sound warbly and unnatural.)
  function shrinkSilence(x, sr, keepMs = 100) {
    const F = Math.round(sr / 100), keep = Math.round(keepMs / 10);
    const out = new Float32Array(x.length);
    let o = 0, quiet = 0;
    for (let s = 0; s < x.length; s += F) {
      const e = Math.min(x.length, s + F);
      let sum = 0; for (let i = s; i < e; i++) sum += x[i] * x[i];
      const silent = Math.sqrt(sum / (e - s)) < 0.006;
      quiet = silent ? quiet + 1 : 0;
      if (silent && quiet > keep) continue;
      out.set(x.subarray(s, e), o); o += e - s;
    }
    return out.subarray(0, o);
  }
  const ULAW = (() => {
    const t = new Float32Array(256);
    for (let i = 0; i < 256; i++) {
      const u = ~i & 0xff, sign = u & 0x80, exp = (u >> 4) & 7, man = u & 0x0f;
      const v = (((man << 3) + 132) << exp) - 132;
      t[i] = (sign ? -v : v) / 32768;
    }
    return t;
  })();
  // Gemini's voice is played exactly as it comes (no speed change). When it is more than 2 s behind, the pauses
  // in it are shortened so it catches up; only beyond 25 s behind is waiting speech skipped.
  let aFlushT = 0;
  function aiPlay(b64) {
    if (!actx) return;
    const bin = atob(b64), n = bin.length;
    if (!n) return;
    const x = new Float32Array(n);
    for (let i = 0; i < n; i++) x[i] = ULAW[bin.charCodeAt(i)];
    aiSchedule(x);
  }
  function aiSchedule(x24, flush = false) {
    const behind = Math.max(0, aNext - actx.currentTime);
    const st = behind > 2 ? shrinkSilence(x24, 24000) : x24;
    const n = st.length;
    if (!n) return;
    // Converted from 24 kHz to the phone's own rate, continuously from piece to piece (the interpolation
    // carries over the last sample and position), so there are no seams. Asking the phone to run its audio at
    // 24 kHz instead made some phones play slowed down, or not at all.
    const R = actx.sampleRate, step = 24000 / R;
    const y = new Float32Array(n + 1);
    y[0] = aRsLast; y.set(st, 1);
    const out = new Float32Array(Math.ceil((n - aRsPos) / step) + 1);
    let k = 0, pos = aRsPos;
    for (; pos < n; pos += step) { const i = Math.floor(pos), f = pos - i; out[k++] = y[i] * (1 - f) + y[i + 1] * f; }
    aRsPos = pos - n; aRsLast = y[n];
    if (!k) return;
    const buf = actx.createBuffer(1, k, R);
    buf.getChannelData(0).set(out.subarray(0, k));
    const now = actx.currentTime, at = performance.now();
    if (aNext < now + 0.05) {
      if (flush) return; // nothing playing: no need to play the padding
      if (aNext) (window.__gaps ||= []).push(+(now - aNext).toFixed(2)); // (silence before this piece, for tests)
      // The voice ran out. If pieces were still streaming (the last one came under 1.2 s ago), the network was
      // late: keep a bigger buffer from now on (0.5 s at first, up to 2 s). Otherwise it is a new sentence.
      if (at - aLastAt < 1200) aBuf = Math.min(2, aBuf + 0.3);
      aNext = now + aBuf;
    }
    if (!flush) aLastAt = at;
    if (aNext - now > 25) { (window.__skips ||= []).push([Date.now() % 100000, +(aNext - now).toFixed(1)]); for (const q of aQueued) { try { q.stop(); } catch { /* ended */ } } aQueued = []; aNext = now + aBuf; }
    const src = actx.createBufferSource();
    src.buffer = buf;
    src.connect(aOut || actx.destination);
    src.start(aNext);
    aNext += buf.duration;
    aQueued.push(src);
    src.onended = () => { aQueued = aQueued.filter((q) => q !== src); };
    const log = (window.__ai ||= []); if (log.length < 600 && !flush) log.push([Date.now() % 100000, +(aNext - now).toFixed(2), aBuf, x24.length, R, n]); // (timing, for tests)
    $("statusText").textContent = "Live · voice";
  }
  function silentWav() { // 1 s of silence, looped on an <audio> element: keeps iPhone audio in "playback" mode
    const n = 16000, b = new ArrayBuffer(44 + n * 2), d = new DataView(b);
    const w = (o, str) => { for (let i = 0; i < str.length; i++) d.setUint8(o + i, str.charCodeAt(i)); };
    w(0, "RIFF"); d.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt "); d.setUint32(16, 16, true);
    d.setUint16(20, 1, true); d.setUint16(22, 1, true); d.setUint32(24, 16000, true); d.setUint32(28, 32000, true);
    d.setUint16(32, 2, true); d.setUint16(34, 16, true); w(36, "data"); d.setUint32(40, n * 2, true);
    return URL.createObjectURL(new Blob([b], { type: "audio/wav" }));
  }
  function aiStart() {
    // iPhone: play even with the silent switch on (newer Safari), and keep the audio session active (older).
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch { /* older Safari */ }
    if (!aSilent) { aSilent = new Audio(silentWav()); aSilent.loop = true; }
    aSilent.play().catch(() => {});
    actx ||= new (window.AudioContext || window.webkitAudioContext)(); // the phone's own rate
    actx.resume();
    // Android/desktop: the voice is played through a media element (like a music player), so the phone keeps
    // playing it with the screen off and shows lock-screen controls. (iPhone stops web audio when locked
    // whatever is done, and its media element can't play this stream reliably: it keeps the direct output.)
    if (!IOS && !aMedia && actx.createMediaStreamDestination) {
      try {
        const dest = actx.createMediaStreamDestination();
        aMedia = new Audio();
        aMedia.srcObject = dest.stream;
        aMedia.play().then(() => { aOut = dest; aSilent?.pause(); }).catch(() => { aOut = null; aMedia = null; });
      } catch { aOut = null; aMedia = null; }
    } else if (aMedia) aMedia.play().catch(() => {});
    mediaSessionOn(true);
    const b = actx.createBuffer(1, 256, actx.sampleRate), s0 = actx.createBufferSource(); s0.buffer = b; s0.connect(actx.destination); s0.start();
    if (aes) return;
    let skip = true; // audio already on the server when joining is old: start with what comes next
    if (polling) { aes = { close() { clearTimeout(aPollT); aes = null; } }; aiPoll(true); return; }
    aes = new EventSource(`${DB}/rooms/${room}-a/c.json`);
    const take = (k, v) => { if (typeof v === "string" && k > aLast) { aLast = k; if (!skip) aiPlay(v); } };
    aes.addEventListener("put", (e) => {
      const { path, data } = JSON.parse(e.data);
      if (path === "/") { for (const k of Object.keys(data || {}).sort()) take(k, data[k]); skip = false; }
      else take(path.slice(1), data);
    });
    aes.addEventListener("patch", (e) => {
      const { data } = JSON.parse(e.data);
      for (const k of Object.keys(data || {}).sort()) take(k.replace(/^.*\//, ""), data[k]);
    });
    aes.onerror = () => { /* EventSource reconnects by itself */ };
  }
  // Slow network mode: new audio pieces fetched with ordinary requests about every 0.3 s.
  let aPollT = 0;
  async function aiPoll(first) {
    if (!aes) return;
    try {
      const data = await getJson(`${DB}/rooms/${room}-a/c.json?` + (first ? q({ orderBy: "$key", limitToLast: 1 }) : q({ orderBy: "$key", startAt: aLast ? aLast + "~" : "a" })));
      for (const k of Object.keys(data || {}).sort()) if (k > aLast) { aLast = k; if (!first) aiPlay(data[k]); }
    } catch { /* retry */ }
    if (aes) aPollT = setTimeout(() => aiPoll(false), 300);
  }
  function aiStop() {
    try { aes?.close(); } catch { /* closed */ }
    for (const q of aQueued) { try { q.stop(); } catch { /* ended */ } }
    aes = null; aNext = 0; aQueued = [];
    aSilent?.pause();
    aMedia?.pause();
    mediaSessionOn(false);
  }
  // Lock-screen / notification controls ("RetiTra live voice"), with pause and play.
  function mediaSessionOn(on) {
    const ms = navigator.mediaSession;
    if (!ms) return;
    try {
      if (on) {
        const m = state.meta || {};
        ms.metadata = new MediaMetadata({ title: m.title || "Live translation", artist: "RetiTra live voice", album: m.targetName || "" });
        ms.setActionHandler("pause", () => { if (speakOn) $("speak").click(); });
        ms.setActionHandler("stop", () => { if (speakOn) $("speak").click(); });
        ms.setActionHandler("play", () => { if (!speakOn) $("speak").click(); });
      }
      ms.playbackState = on ? "playing" : "paused";
    } catch { /* older browsers */ }
  }


  // Keep the screen on while following (where supported).
  let wake = null;
  async function keepAwake() { try { wake = await navigator.wakeLock?.request("screen"); } catch { /* not allowed */ } }
  document.addEventListener("visibilitychange", () => { if (!document.hidden && (speakOn || wake)) keepAwake(); });
  document.addEventListener("click", () => { if (!wake) keepAwake(); }, { once: true });

  // ---- live connection: the database's streaming API (server-sent events) ----
  function setPath(path, data) {
    const parts = path.split("/").filter(Boolean);
    if (!parts.length) { state = data && typeof data === "object" ? data : {}; return; }
    let o = state;
    for (let i = 0; i < parts.length - 1; i++) { if (typeof o[parts[i]] !== "object" || !o[parts[i]]) o[parts[i]] = {}; o = o[parts[i]]; }
    const last = parts[parts.length - 1];
    if (data === null) delete o[last]; else o[last] = data;
  }
  // The live stream (server-sent events) normally delivers every change at once. Some networks and in-app
  // browsers (KakaoTalk, Zalo, Facebook...) hold such streams back, and the page then stayed on "Connecting...".
  // If nothing has arrived after 4 s, the page switches to asking for changes about 3 times a second with
  // ordinary requests, which those networks let through.
  let es = null, lastEvent = 0, gotData = false, polling = false, pollTimer = 0, fallbackTimer = 0;
  window.__rtv = () => ({ polling, gotData, lastEvent, route: aOut ? "media" : "direct", media: !!aMedia && !aMedia.paused }); // (for tests)
  function connect() {
    if (!room) { status("bad", "No meeting code"); render(); return; }
    if (polling) return;
    try { es?.close(); } catch { /* closed */ }
    es = new EventSource(`${DB}/rooms/${room}.json`);
    const touch = () => { lastEvent = Date.now(); };
    es.addEventListener("put", (e) => {
      touch(); gotData = true;
      const { path, data } = JSON.parse(e.data);
      setPath(path, data);
      render(); showLive();
    });
    es.addEventListener("patch", (e) => {
      touch(); gotData = true;
      const { path, data } = JSON.parse(e.data);
      for (const [k, v] of Object.entries(data || {})) setPath(path.replace(/\/$/, "") + "/" + k, v);
      render(); showLive();
    });
    es.addEventListener("keep-alive", touch);
    es.addEventListener("cancel", () => { status("bad", "Meeting not available"); });
    es.onerror = () => { if (!polling) status("bad", "Reconnecting…"); };
    es.onopen = touch;
    clearTimeout(fallbackTimer);
    fallbackTimer = setTimeout(() => { if (!gotData) startPolling(); }, 4000);
  }
  const q = (o) => Object.entries(o).map(([k, v]) => k + "=" + encodeURIComponent(JSON.stringify(v))).join("&");
  async function getJson(url) { const r = await fetch(url, { cache: "no-store" }); if (!r.ok) throw new Error(r.status); return r.json(); }
  function startPolling() {
    if (polling) return;
    polling = true;
    try { es?.close(); } catch { /* closed */ }
    es = null;
    status("bad", "Connecting (slow network mode)…");
    if (aes) { aiStop(); aiStart(); } // the voice switches too
    poll();
  }
  async function poll() {
    clearTimeout(pollTimer);
    try {
      // The meeting info and the latest 80 lines (older lines stay on the page).
      const [owner, meta, lines] = await Promise.all([
        getJson(`${DB}/rooms/${room}/owner.json`),
        getJson(`${DB}/rooms/${room}/meta.json`),
        getJson(`${DB}/rooms/${room}/lines.json?${q({ orderBy: "$key", limitToLast: 80 })}`),
      ]);
      lastEvent = Date.now(); gotData = true;
      state.owner = owner; state.meta = meta || {};
      if (!owner) state.lines = {};
      else {
        state.lines ||= {};
        const got = lines || {};
        const keys = Object.keys(got);
        const lo = keys.sort()[0];
        // Lines inside the fetched range that are gone were removed by the presenter.
        for (const k of Object.keys(state.lines)) if (lo && k >= lo && !(k in got)) delete state.lines[k];
        Object.assign(state.lines, got);
      }
      render(); showLive();
      if (state.owner) $("statusText").textContent += " (slow network mode)";
    } catch {
      status("bad", "Reconnecting (slow network mode)…");
    }
    pollTimer = setTimeout(poll, document.hidden ? 2000 : 350);
  }
  function showLive() {
    const m = state.meta || {};
    if (!state.owner) status("bad", "Not started / ended");
    else if (m.paused) status("bad", "Paused");
    else if (m.live) status("live", "Live");
    else status("", "Not listening");
  }
  // A connection that went silent (phone slept, Wi-Fi changed) is reopened.
  setInterval(() => { if (lastEvent && Date.now() - lastEvent > 65000) connect(); }, 15000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - lastEvent > 20000) connect(); });
  window.addEventListener("hashchange", () => location.reload());
  if (/[?&]poll/.test(location.search)) startPolling(); else connect(); // (?poll: test the slow network mode)
})();
</script>

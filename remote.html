<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#05070f" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="RetiTra Remote" />
<title>RetiTra Remote</title>
<link rel="manifest" href="remote.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #05070f; --panel: rgb(14 20 38 / 88%); --card: rgb(20 28 52 / 80%); --border: rgb(120 160 255 / 18%);
    --text: #e8eeff; --muted: #8fa1cf; --accent: #22d3ee; --ok: #34f5c5; --warn: #fbbf24; --bad: #f87171;
    --on: rgb(34 211 238 / 18%);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f6fc; --panel: rgb(255 255 255 / 94%); --card: #fff; --border: rgb(40 70 150 / 15%);
      --text: #0f172a; --muted: #5a6784; --accent: #0891b2; --ok: #059669; --warn: #b45309; --bad: #dc2626;
      --on: rgb(8 145 178 / 12%);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(900px 600px at 80% -10%, rgb(34 211 238 / 10%), transparent 60%), var(--bg);
    color: var(--text); font: 16px/1.45 "Inter", "Noto Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px;
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px; background: var(--panel); border-bottom: 1px solid var(--border);
    backdrop-filter: blur(12px);
  }
  .brand { font-weight: 600; letter-spacing: -0.01em; flex: 1; }
  .brand em { font-style: normal; color: var(--accent); }
  .conn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .conn i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .conn.ok i { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .conn.bad i { background: var(--warn); }
  main { padding: 14px 16px calc(28px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; }
  .label { font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--muted); margin: 0 0 8px; }
  .state { display: flex; align-items: baseline; gap: 10px; }
  .state b { font-size: 22px; font-weight: 600; }
  .state span { color: var(--muted); font-size: 13px; }
  .preview { margin-top: 10px; min-height: 44px; }
  .preview .o { color: var(--muted); font-size: 13px; }
  .preview .t { font-size: 16px; font-weight: 500; margin-top: 2px; }
  button, select {
    font: inherit; color: var(--text); background: transparent; border: 1px solid var(--border);
    border-radius: 12px; min-height: 48px; padding: 10px 12px; cursor: pointer; touch-action: manipulation;
  }
  button:active { transform: scale(.98); }
  button:disabled, select:disabled { opacity: .45; cursor: default; transform: none; }
  button.on { background: var(--on); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .big { width: 100%; min-height: 86px; font-size: 24px; font-weight: 600; border-radius: 18px; }
  .big.go { background: var(--accent); border-color: var(--accent); color: #031018; }
  .big.pause { background: rgb(251 191 36 / 16%); border-color: var(--warn); color: var(--warn); }
  .listen { width: 100%; min-height: 58px; font-size: 18px; font-weight: 600; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 8px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stop { color: var(--bad); border-color: rgb(248 113 113 / 45%); }
  select { width: 100%; appearance: auto; background: var(--card); }
  .field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  .msg { text-align: center; color: var(--muted); padding: 22vh 20px 0; font-size: 15px; }
  .msg b { display: block; color: var(--text); font-size: 18px; margin-bottom: 8px; }
  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 8px 16px; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none; backdrop-filter: blur(12px); }
  .toast.show { opacity: 1; }
  footer { text-align: center; font-size: 11px; color: var(--muted); padding-bottom: 8px; }
  footer button { min-height: 36px; font-size: 12px; padding: 6px 12px; margin-top: 6px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="brand">Reti<em>Tra</em> Remote</div>
  <span class="conn" id="conn"><i></i><span id="connText">Connecting…</span></span>
</header>

<div id="msg" class="msg" hidden></div>

<main id="app" hidden>
  <section class="card">
    <p class="label">ON THE SCREEN</p>
    <div class="state"><b id="stateText">Stopped</b><span id="titleText"></span></div>
    <div class="preview" id="preview"><div class="o" id="pvO"></div><div class="t" id="pvT"></div></div>
  </section>

  <button id="mainBtn" class="big go">▶ Start</button>
  <button id="stopBtn" class="big stop" style="min-height:58px;font-size:18px">■ Stop</button>

  <section class="card">
    <button id="listenBtn" class="listen">🎧 Listen on this phone</button>
    <p class="note" id="listenNote">Plays the translated voice on this phone only (use headphones). The computer's own speakers are set separately with Speak aloud.</p>
  </section>

  <section class="card">
    <p class="label">TRANSLATION MODE</p>
    <div class="row" id="polishRow">
      <button data-polish="accurate">Accurate</button>
      <button data-polish="medium">Balanced</button>
      <button data-polish="fast">Fast</button>
    </div>
  </section>

  <section class="card">
    <p class="label">SCREEN</p>
    <div class="row2">
      <button id="speakBtn">🔊 Speak aloud</button>
      <button id="origBtn">Show original</button>
      <button id="presentBtn">⛶ Present</button>
      <button id="shareBtn">Share to phones</button>
    </div>
    <div class="row2" style="margin-top:8px">
      <button id="fontDown">A− Smaller</button>
      <button id="fontUp">A+ Bigger</button>
    </div>
  </section>

  <section class="card">
    <p class="label">LANGUAGES</p>
    <div class="row" id="dirRow">
      <button data-dir="one_way">One-way</button>
      <button data-dir="two_way">Two-way</button>
    </div>
    <div id="oneWay" style="margin-top:8px">
      <label class="field">Translate into<select id="target"></select></label>
    </div>
    <div id="twoWay" class="row2" style="margin-top:8px">
      <label class="field">Language A<select id="langA"></select></label>
      <label class="field">Language B<select id="langB"></select></label>
    </div>
    <p class="note" id="langNote" hidden>Stop the meeting to change languages.</p>
  </section>

  <footer>
    <div id="build"></div>
    <button id="unpairBtn">Unpair this phone</button>
  </footer>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const BUILD = "1120-6";
  const API_KEY = "AIzaSyCsuREGnHgpaXWpQLgLPiL2ECgtMUtP9Cc"; // the Firebase web key (public by design)
  const DB = "https://retitra-live-default-rtdb.asia-southeast1.firebasedatabase.app";
  const $ = (id) => document.getElementById(id);
  const SAVE = "rtRemote";
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(SAVE) || "{}"); } catch { /* storage blocked */ }
  const persist = () => { try { localStorage.setItem(SAVE, JSON.stringify(saved)); } catch { /* storage blocked */ } };

  // The pairing key comes from the QR code (#key). It is kept on this phone and removed from the address, so the
  // page also works from the home screen and the key doesn't show in screenshots or history.
  const fromQr = location.hash.slice(1);
  if (/^[a-z0-9]{24,64}$/.test(fromQr)) {
    if (fromQr !== saved.key) saved = { key: fromQr, refresh: saved.refresh };
    persist();
    history.replaceState(null, "", location.pathname + location.search);
  }
  // A new QR code scanned while this page is already open only changes the address after "#": start afresh.
  addEventListener("hashchange", () => { if (/^[a-z0-9]{24,64}$/.test(location.hash.slice(1))) location.reload(); });
  $("build").textContent = "Version " + BUILD;

  function toast(t) { const e = $("toast"); e.textContent = t; e.classList.add("show"); clearTimeout(e.t); e.t = setTimeout(() => e.classList.remove("show"), 1600); }
  let ended = false; // (paired elsewhere or pairing ended: the message stays, the regular refresh doesn't hide it)
  function message(title, text) { $("app").hidden = true; const m = $("msg"); m.hidden = false; m.innerHTML = ""; const b = document.createElement("b"); b.textContent = title; m.append(b, document.createTextNode(text)); }
  function conn(kind, text) { $("conn").className = "conn " + kind; $("connText").textContent = text; }

  if (!saved.key) {
    message("Not paired", "On the computer, press Remote in RetiTra and scan the QR code with this phone.");
    conn("bad", "Not paired");
    return;
  }

  // ---- sign-in (anonymous, one account per phone) ----
  let token = "", tokenAt = 0;
  async function auth() {
    if (token && Date.now() - tokenAt < 50 * 60e3) return token;
    if (saved.refresh) {
      try {
        const r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${API_KEY}`, {
          method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(saved.refresh),
        }).then((x) => x.json());
        if (r.id_token) { token = r.id_token; tokenAt = Date.now(); saved.refresh = r.refresh_token; saved.uid = r.user_id; persist(); return token; }
      } catch { /* sign in again */ }
    }
    const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${API_KEY}`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ returnSecureToken: true }),
    }).then((x) => x.json());
    if (!r.idToken) throw new Error(r.error?.message || "sign-in failed");
    token = r.idToken; tokenAt = Date.now(); saved.refresh = r.refreshToken; saved.uid = r.localId; persist();
    return token;
  }
  const cmdUrl = (t) => `${DB}/rooms/${saved.key}-c.json?auth=${t}`;

  // ---- pairing: this phone claims the command channel; after that only it can write there ----
  async function claim() {
    const t = await auth();
    const r = await fetch(cmdUrl(t), { method: "PATCH", body: JSON.stringify({ owner: saved.uid, phoneAt: Date.now() }) });
    if (r.status === 401 || r.status === 403) return false;
    if (!r.ok) throw new Error("HTTP " + r.status);
    return true;
  }

  // ---- commands ----
  let lastSent = 0;
  const pending = new Map(); // id -> timer
  async function send(a, v) {
    const id = Math.max(Date.now(), lastSent + 1); lastSent = id;
    try {
      const t = await auth();
      const r = await fetch(cmdUrl(t), { method: "PATCH", body: JSON.stringify({ cmd: { id, a, v: v ?? null } }) });
      if (r.status === 401 || r.status === 403) { token = ""; if (!(await claim())) { lost(); return; } return send(a, v); }
      if (!r.ok) throw new Error();
      pending.set(id, setTimeout(() => { pending.delete(id); if (fresh()) toast("The computer didn't respond"); }, 4000));
    } catch { toast("No connection: not sent"); }
  }
  function lost() {
    ended = true;
    message("Paired with another phone", "This screen is controlled by another phone. To use this one, press Remote → New pairing on the computer and scan the new QR code.");
    conn("bad", "Not paired");
  }

  // ---- the computer's state ----
  let st = null, stAt = 0, gotData = false, polling = false;
  const fresh = () => st && Date.now() - (st.at || 0) < 15000 && Date.now() - stAt < 20000;
  let noteSeen = null;
  function setState(data) {
    if (data?.note && noteSeen !== null && data.note.t !== noteSeen) toast(data.note.text);
    noteSeen = data?.note?.t || 0;
    st = data; stAt = Date.now();
    if (st?.lastCmd) for (const [id, tm] of pending) if (id <= st.lastCmd) { clearTimeout(tm); pending.delete(id); }
    render();
  }
  function listen() {
    let es;
    try { es = new EventSource(`${DB}/rooms/${saved.key}-s.json`); } catch { poll(); return; }
    es.addEventListener("put", (e) => {
      gotData = true;
      const { path, data } = JSON.parse(e.data);
      // The computer made a new pairing (its state room is gone): this phone no longer controls it.
      if (path === "/" && data === null && st) { ended = true; message("Pairing ended", "The computer made a new pairing. Scan the new QR code (Remote on the computer) to control it again."); conn("bad", "Not paired"); return; }
      if (path === "/") setState(data);
      else { st = st || {}; st[path.slice(1)] = data; setState(st); }
    });
    es.addEventListener("patch", (e) => { gotData = true; const { data } = JSON.parse(e.data); setState(Object.assign(st || {}, data)); });
    setTimeout(() => { if (!gotData) { try { es.close(); } catch { /* closed */ } poll(); } }, 4000);
  }
  async function poll() { // (networks that hold back live streams)
    if (polling) return; polling = true;
    for (;;) {
      try {
        const r = await fetch(`${DB}/rooms/${saved.key}-s.json`, { cache: "no-store" });
        if (r.ok) {
          const j = await r.json();
          if (j === null && st) { ended = true; message("Pairing ended", "The computer made a new pairing. Scan the new QR code (Remote on the computer) to control it again."); conn("bad", "Not paired"); return; }
          setState(j);
        }
      } catch { /* retry */ }
      await new Promise((r) => setTimeout(r, 700));
    }
  }
  setInterval(render, 2000);

  function fillLangs(sel, value) {
    const list = st?.langs || [];
    if (sel.options.length !== list.length) sel.innerHTML = list.map(([c, n]) => `<option value="${c}">${n.replace(/[<>&]/g, "")}</option>`).join("");
    if (document.activeElement !== sel) sel.value = value || "";
  }
  function render() {
    if (ended) return;
    if (!st) { conn("bad", "Waiting for the computer…"); return; }
    $("msg").hidden = true; $("app").hidden = false;
    conn(fresh() ? "ok" : "bad", fresh() ? "Connected" : "Computer offline");
    const live = !!st.running, paused = live && !!st.paused;
    $("stateText").textContent = !live ? "Stopped" : paused ? "Paused" : "Listening";
    $("titleText").textContent = st.title || "";
    $("pvO").textContent = st.line?.o || "";
    $("pvT").textContent = st.line?.t || (live ? "" : "Press Start to begin.");
    const main = $("mainBtn");
    main.textContent = !live ? "▶ Start" : paused ? "▶ Resume" : "⏸ Pause";
    main.className = "big " + (live && !paused ? "pause" : "go");
    $("stopBtn").disabled = !live;
    document.querySelectorAll("[data-polish]").forEach((b) => b.classList.toggle("on", b.dataset.polish === st.polish));
    document.querySelectorAll("[data-dir]").forEach((b) => { b.classList.toggle("on", b.dataset.dir === st.mode); b.disabled = live; });
    $("speakBtn").classList.toggle("on", !!st.speak);
    $("origBtn").classList.toggle("on", !!st.showOriginal);
    $("presentBtn").classList.toggle("on", !!st.present);
    $("shareBtn").classList.toggle("on", !!st.share);
    $("shareBtn").textContent = st.share ? "Sharing to phones" : "Share to phones";
    $("oneWay").hidden = st.mode === "two_way"; $("twoWay").hidden = st.mode !== "two_way";
    fillLangs($("target"), st.target); fillLangs($("langA"), st.langA); fillLangs($("langB"), st.langB);
    for (const id of ["target", "langA", "langB"]) $(id).disabled = live;
    $("langNote").hidden = !live;
    $("listenBtn").classList.toggle("on", listening);
    $("listenBtn").textContent = listening ? "🎧 Listening on this phone (tap to stop)" : "🎧 Listen on this phone";
    if (listening) $("listenNote").textContent = !live ? "The voice starts when the meeting runs." : paused ? "The meeting is paused." : st.hearing ? "Playing the translated voice here. Speak aloud on the computer is separate." : "Connecting the voice…";
    else $("listenNote").textContent = "Plays the translated voice on this phone only (use headphones). The computer's own speakers are set separately with Speak aloud.";
  }


  // ---- "Listen on this phone": the AI interpreter's voice, streamed from the computer to this phone only ----
  // The computer sends 24 kHz mu-law pieces to <key>-a while this phone says it is listening (listenAt, renewed
  // every 20 s). Played like the audience page does: each piece starts exactly where the previous one ends, a
  // small buffer absorbs network jitter, long pauses are shortened when the voice falls behind.
  let listening = false, listenTimer = 0;
  let actx = null, aes = null, aLast = "", aNext = 0, aQueued = [], aSilent = null, aBuf = 0.5, aLastAt = 0, aRsPos = 0, aRsLast = 0;
  let aOut = null, aMedia = null, aPollT = 0;
  const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
  function shrinkSilence(x, sr, keepMs = 100) {
    const F = Math.round(sr / 100), keep = Math.round(keepMs / 10);
    const out = new Float32Array(x.length);
    let o = 0, quiet = 0;
    for (let i0 = 0; i0 < x.length; i0 += F) {
      const e = Math.min(x.length, i0 + F);
      let sum = 0; for (let i = i0; i < e; i++) sum += x[i] * x[i];
      const silent = Math.sqrt(sum / (e - i0)) < 0.006;
      quiet = silent ? quiet + 1 : 0;
      if (silent && quiet > keep) continue;
      out.set(x.subarray(i0, e), o); o += e - i0;
    }
    return out.subarray(0, o);
  }
  const ULAW = (() => {
    const t = new Float32Array(256);
    for (let i = 0; i < 256; i++) {
      const u = ~i & 0xff, sign = u & 0x80, exp = (u >> 4) & 7, man = u & 0x0f;
      const v = (((man << 3) + 132) << exp) - 132;
      t[i] = (sign ? -v : v) / 32768;
    }
    return t;
  })();
  function aiPlay(b64) {
    if (!actx) return;
    const bin = atob(b64), n = bin.length;
    if (!n) return;
    const x = new Float32Array(n);
    for (let i = 0; i < n; i++) x[i] = ULAW[bin.charCodeAt(i)];
    const behind = Math.max(0, aNext - actx.currentTime);
    const s24 = behind > 2 ? shrinkSilence(x, 24000) : x;
    const m = s24.length;
    if (!m) return;
    const R = actx.sampleRate, step = 24000 / R;
    const y = new Float32Array(m + 1);
    y[0] = aRsLast; y.set(s24, 1);
    const out = new Float32Array(Math.ceil((m - aRsPos) / step) + 1);
    let k = 0, pos = aRsPos;
    for (; pos < m; pos += step) { const i = Math.floor(pos), f = pos - i; out[k++] = y[i] * (1 - f) + y[i + 1] * f; }
    aRsPos = pos - m; aRsLast = y[m];
    if (!k) return;
    const buf = actx.createBuffer(1, k, R);
    buf.getChannelData(0).set(out.subarray(0, k));
    const now = actx.currentTime, at = performance.now();
    if (aNext < now + 0.05) { if (at - aLastAt < 1200) aBuf = Math.min(2, aBuf + 0.3); aNext = now + aBuf; }
    aLastAt = at;
    if (aNext - now > 25) { for (const q of aQueued) { try { q.stop(); } catch { /* ended */ } } aQueued = []; aNext = now + aBuf; }
    const src = actx.createBufferSource();
    src.buffer = buf;
    src.connect(aOut || actx.destination);
    src.start(aNext);
    aNext += buf.duration;
    aQueued.push(src);
    src.onended = () => { aQueued = aQueued.filter((q) => q !== src); };
    if (window.__rtl) window.__rtl.push([Date.now(), n]);
  }
  function silentWav() { // 1 s of silence, looped: keeps iPhone audio in "playback" mode
    const n = 16000, b = new ArrayBuffer(44 + n * 2), d = new DataView(b);
    const w = (o, str) => { for (let i = 0; i < str.length; i++) d.setUint8(o + i, str.charCodeAt(i)); };
    w(0, "RIFF"); d.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt "); d.setUint32(16, 16, true);
    d.setUint16(20, 1, true); d.setUint16(22, 1, true); d.setUint32(24, 16000, true); d.setUint32(28, 32000, true);
    d.setUint16(32, 2, true); d.setUint16(34, 16, true); w(36, "data"); d.setUint32(40, n * 2, true);
    return URL.createObjectURL(new Blob([b], { type: "audio/wav" }));
  }
  async function listenPing(on) {
    try {
      const t = await auth();
      await fetch(cmdUrl(t), { method: "PATCH", body: JSON.stringify({ listenAt: on ? Date.now() : 0 }) });
    } catch { /* next ping */ }
  }
  function listenStart() {
    // Started by the tap (phones only allow sound after one).
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch { /* older Safari */ }
    if (!aSilent) { aSilent = new Audio(silentWav()); aSilent.loop = true; }
    aSilent.play().catch(() => {});
    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    actx.resume();
    // Android: through a media element, so it keeps playing with the screen off (iPhone stops web audio when locked).
    if (!IOS && !aMedia && actx.createMediaStreamDestination) {
      try {
        const dest = actx.createMediaStreamDestination();
        aMedia = new Audio(); aMedia.srcObject = dest.stream;
        aMedia.play().then(() => { aOut = dest; aSilent?.pause(); }).catch(() => { aOut = null; aMedia = null; });
      } catch { aOut = null; aMedia = null; }
    } else if (aMedia) aMedia.play().catch(() => {});
    const b = actx.createBuffer(1, 256, actx.sampleRate), s0 = actx.createBufferSource(); s0.buffer = b; s0.connect(actx.destination); s0.start();
    listening = true;
    listenPing(true);
    clearInterval(listenTimer); listenTimer = setInterval(() => listenPing(true), 20000);
    if (navigator.mediaSession) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({ title: "Live translation", artist: "RetiTra Remote" });
        navigator.mediaSession.setActionHandler("pause", () => listenStop());
        navigator.mediaSession.setActionHandler("stop", () => listenStop());
      } catch { /* not supported */ }
    }
    let skip = true; // what is already on the server is old: start with what comes next
    const url = `${DB}/rooms/${saved.key}-a/c.json`;
    if (polling) { aes = { close() { clearTimeout(aPollT); } }; aiPoll(true); render(); return; }
    aes = new EventSource(url);
    const take = (k, v) => { if (typeof v === "string" && k > aLast) { aLast = k; if (!skip) aiPlay(v); } };
    aes.addEventListener("put", (e) => {
      const { path, data } = JSON.parse(e.data);
      if (path === "/") { for (const k of Object.keys(data || {}).sort()) take(k, data[k]); skip = false; }
      else take(path.slice(1), data);
    });
    aes.addEventListener("patch", (e) => {
      const { data } = JSON.parse(e.data);
      for (const k of Object.keys(data || {}).sort()) take(k.replace(/^.*\//, ""), data[k]);
    });
    render();
  }
  async function aiPoll(first) {
    if (!listening) return;
    try {
      const q = first ? 'orderBy="$key"&limitToLast=1' : `orderBy="$key"&startAt=${encodeURIComponent(JSON.stringify(aLast ? aLast + "~" : "a"))}`;
      const r = await fetch(`${DB}/rooms/${saved.key}-a/c.json?${q}`, { cache: "no-store" });
      const data = r.ok ? await r.json() : null;
      for (const k of Object.keys(data || {}).sort()) if (k > aLast) { aLast = k; if (!first) aiPlay(data[k]); }
    } catch { /* retry */ }
    if (listening) aPollT = setTimeout(() => aiPoll(false), 300);
  }
  function listenStop() {
    listening = false;
    clearInterval(listenTimer);
    listenPing(false);
    try { aes?.close(); } catch { /* closed */ }
    for (const q of aQueued) { try { q.stop(); } catch { /* ended */ } }
    aes = null; aNext = 0; aQueued = [];
    aSilent?.pause(); aMedia?.pause();
    render();
  }

  // ---- buttons ----
  $("mainBtn").onclick = () => { if (!st) return; if (!st.running) send("start"); else send(st.paused ? "resume" : "pause"); };
  $("stopBtn").onclick = () => { if (confirm("Stop the meeting?")) send("stop"); };
  document.querySelectorAll("[data-polish]").forEach((b) => (b.onclick = () => send("polish", b.dataset.polish)));
  document.querySelectorAll("[data-dir]").forEach((b) => (b.onclick = () => send("dir", b.dataset.dir)));
  $("speakBtn").onclick = () => send("speak", !st?.speak);
  $("listenBtn").onclick = () => (listening ? listenStop() : listenStart());
  $("origBtn").onclick = () => send("orig", !st?.showOriginal);
  $("presentBtn").onclick = () => send("present", !st?.present);
  $("shareBtn").onclick = () => { if (st?.share && !confirm("Stop sharing to phones? The audience's phones stop updating.")) return; send("share", !st?.share); };
  $("fontDown").onclick = () => send("font", -1);
  $("fontUp").onclick = () => send("font", 1);
  for (const id of ["target", "langA", "langB"]) $(id).onchange = (e) => send(id, e.target.value);
  $("unpairBtn").onclick = () => {
    if (!confirm("Unpair this phone? It will no longer control the computer until you scan a new QR code.")) return;
    saved = {}; persist(); location.reload();
  };

  (async () => {
    try {
      if (!(await claim())) { lost(); return; }
      listenPing(false); // (after a reload the voice needs a new tap: phones only play sound after one)
      listen();
    } catch {
      conn("bad", "No connection"); setTimeout(() => location.reload(), 5000);
    }
  })();
})();
</script>
</body>
</html>
